name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# The sections follow the branch prefixes this project already uses, so a
# release note writes itself from how the work was branched.
#
# The emoji are there to be scanned rather than read: somebody opening a
# release wants to know within a second whether it carries features or only
# fixes, and a heading with a picture in front of it answers that before the
# words do. Second labels are listed where GitHub's own defaults differ from
# this project's prefixes — a pull request labelled "bug" by hand should not
# fall out of the notes.
categories:
  - title: "🚀 New"
    labels: [feature, enhancement]
  - title: "🐛 Fixed"
    labels: [fix, bug, bugfix]
  - title: "📖 Documentation"
    labels: [docs, documentation]
  - title: "🧪 Tests"
    labels: [test]
  - title: "🔧 Build and tooling"
    labels: [chore, build, ci]
  - title: "📦 Dependencies"
    labels: [dependencies]
    collapse-after: 5

# A pull request that carries no label still has to appear somewhere, or the
# notes would quietly omit it.
exclude-labels: [skip-changelog]

# A release with nothing in it is a release that should not have been cut, and
# saying so beats an empty heading.
no-changes-template: "- Nothing user-visible. This release only moves the tag."

change-template: "- $TITLE (#$NUMBER)"
# Backticks and underscores in a title would otherwise become markup.
change-title-escapes: '\<*_&`#@'

version-resolver:
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [fix, bug, bugfix, docs, documentation, test, chore, build, ci, dependencies]
  default: patch

autolabeler:
  - label: feature
    branch: ['/^feature\/.*/']
  - label: fix
    branch: ['/^fix\/.*/']
  - label: docs
    branch: ['/^docs\/.*/']
  - label: test
    branch: ['/^test\/.*/']
  - label: chore
    branch: ['/^chore\/.*/', '/^release\/.*/']

template: |
  $CHANGES

  ## Installing

  Download `rig-exporter.exe` below and run it. No installer, no runtime, no
  administrator rights. Settings live in a local web interface the tray icon
  opens; the configuration is written to `%APPDATA%\rig-exporter`.

  Verify the download against `rig-exporter.exe.sha256`:

  ```powershell
  (Get-FileHash .\rig-exporter.exe -Algorithm SHA256).Hash
  ```

  **Full changelog:** $PREVIOUS_TAG...v$RESOLVED_VERSION
