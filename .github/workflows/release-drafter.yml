name: Release drafter

# Two jobs from one configuration. The draft is rebuilt on every merge to main,
# so the notes for the next release are always current rather than written from
# memory at release time. The labeller runs on the pull request itself, because
# the label is what decides which section of those notes it lands in.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  draft:
    # Push only. This job holds contents: write, and without the guard it also
    # ran on every pull_request_target — rewriting the draft release whenever
    # anybody opened or updated a pull request, which is not what a draft of the
    # next release is for. The mirror image of the label guard below; taking the
    # same condition as that one would be the opposite mistake, leaving the
    # draft to run on pull requests and never on a merge to main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  label:
    # Labels come from the branch prefix, which this project uses consistently:
    # feature/, fix/, docs/, test/, chore/. Nothing to remember at review time.
    #
    # The sub-action, not the root one. v7 split the action in two: the root
    # release-drafter/release-drafter@v7 is now the drafter alone, and labelling
    # moved to autolabeler@v7. The `disable-releaser` and `disable-autolabeler`
    # inputs went with the split — neither exists in v7's action.yml — and
    # GitHub ignores an unknown input instead of failing on it. So under v7 the
    # root action here read `disable-releaser: true`, discarded it, drafted a
    # release anyway, and died on "Resource not accessible by integration". The
    # option had stopped holding; the permission below still did.
    #
    # Which is why that permission stays at read. This job runs on
    # pull_request_target, so it carries the base repository's token while
    # checking out a fork's branch. contents: write would silence the error by
    # handing that fork exactly what the guard exists to withhold.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
