# Which staticcheck checks this project runs: all of them.
#
# The command line tool knows 149 checks — `staticcheck -list-checks`:
#
#   SA  95  correctness. Misused standard library, concurrency mistakes, code
#           that cannot do what it says. No argument against any of it.
#   S1  35  simplifications. Cheap to honour, and they keep code readable.
#   ST  18  style. The non-default ones are on too: package comments, doc
#           comments that start with the name they document, consistent
#           receiver names, proper initialisms. This project already writes
#           that way everywhere, so switching them on costs nothing today and
#           stops the convention rotting tomorrow — the only thing a style
#           check is ever good for.
#   U1   1  unused code.
#
# The QF group from the documentation is deliberately absent, and not by our
# choice: it does not exist in the command line tool at all. Those checks drive
# automatic refactorings inside gopls and never reach a build. Asking for
# QF1004 explicitly reports nothing, and the group does not appear in
# -list-checks. Nothing to switch off, and nothing to miss — they describe
# preferences, not defects.
#
# The whole set currently reports nothing, so this file records a state that
# holds rather than a wish. `.\build.ps1 -Check` runs it.
checks = ["all"]
